<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="SampleTrack — QC sample approval workspace built with Rune.">
<title>SampleTrack — QC Workspace</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    background: #eef2f8; color: #0d1b2e;
  }
  @media (prefers-color-scheme: dark) {
    html, body { background: #0a1220; color: #e6eefc; }
  }
  #status {
    font: 11px/1.6 ui-monospace, "IBM Plex Mono", Consolas, monospace;
    text-transform: uppercase; letter-spacing: .12em;
    padding: 24px;
  }
</style>
<div id="status">MEMUAT SAMPLE LOG…</div>
<noscript><p style="padding:24px;font:13px system-ui">Aktifkan JavaScript dan WebGPU untuk membuka SampleTrack.</p></noscript>

<script type="module">
import init from './app.js';
try {
    if (!navigator.gpu) throw new Error('WebGPU membutuhkan browser yang mendukung dan HTTPS.');
    await init();
    document.querySelector('#status').remove();
} catch (error) {
    document.querySelector('#status').textContent = String(error);
    console.error(error);
}
</script>
</html>
